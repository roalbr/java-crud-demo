version: '3.8'

services:
  # ======== Aplicação ========
  app:
    build: .
    container_name: crud-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=crud_demo
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=crud_demo_audit
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - crud-network
    restart: unless-stopped

  # ======== PostgreSQL ========
  postgres:
    image: postgres:16-alpine
    container_name: crud-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=crud_demo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crud-network

  # ======== MongoDB ========
  mongodb:
    image: mongo:7.0
    container_name: crud-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crud-network

  # ======== Prometheus ========
  prometheus:
    image: prom/prometheus:latest
    container_name: crud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app
    networks:
      - crud-network

  # ======== Grafana ========
  grafana:
    image: grafana/grafana:latest
    container_name: crud-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - crud-network

volumes:
  postgres_data:
  mongo_data:
  grafana_data:

networks:
  crud-network:
    driver: bridge
