name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build project
        run: mvn clean compile -B

      - name: Run unit tests
        run: mvn test -B

      - name: Package application
        run: mvn package -DskipTests -B

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t java-crud-demo:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test-app \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e "SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/test" \
            -e "SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration" \
            -p 8080:8080 \
            java-crud-demo:latest
          sleep 15
          curl -f http://localhost:8080/actuator/health || exit 1
          docker stop test-app
